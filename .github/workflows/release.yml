name: Release Build

# MANUAL release build — not per-commit CI. Run from the Actions tab
# (workflow_dispatch). Builds installers for Windows + Linux, then attaches
# them to a draft GitHub Release. The app itself stays 100% local; this is
# only a build servant for producing downloadable artifacts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (e.g. v0.1.0). Leave blank for draft-<date>"
        required: false
        default: ""

jobs:
  build-windows:
    name: Build Windows MSI
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Install pandoc + typst sidecars
        run: |
          choco install pandoc -y --no-progress
          # typst (pinned; adjust version as needed)
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-pc-windows-msvc.zip -o typst.zip
          Expand-Archive typst.zip -DestinationPath typst-tmp
          Move-Item typst-tmp\typst-x86_64-pc-windows-msvc\typst.exe src-tauri\bin\typst-x86_64-pc-windows-msvc.exe -Force
          Copy-Item (Get-Command pandoc).Source src-tauri\bin\pandoc-x86_64-pc-windows-msvc.exe
          ls src-tauri\bin

      - name: Install frontend deps
        run: npm ci

      - name: Build + bundle (MSI)
        run: bash scripts/build-release.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: quillmd-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build Linux AppImage + deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Install pandoc + typst sidecars
        run: |
          sudo apt-get install -y pandoc
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz -o typst.tar.xz
          tar -xJf typst.tar.xz
          cp typst-x86_64-unknown-linux-musl/typst src-tauri/bin/typst-x86_64-unknown-linux-gnu
          cp /usr/bin/pandoc src-tauri/bin/pandoc-x86_64-unknown-linux-gnu
          ls src-tauri/bin

      - name: Install frontend deps
        run: npm ci

      - name: Build + bundle (AppImage + deb)
        run: bash scripts/build-release.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: quillmd-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  publish:
    name: Publish draft release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=draft-$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release + attach installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "QuillMD ${{ steps.tag.outputs.tag }}" \
            --notes "Self-contained installers (bundles pandoc + typst). No dev tools required." \
            --draft
          # Upload files only (find excludes directories like nsis/)
          find dist -type f -print0 | while IFS= read -r -d '' f; do
            gh release upload "${{ steps.tag.outputs.tag }}" "$f" \
              --repo "${{ github.repository }}" --clobber
          done
